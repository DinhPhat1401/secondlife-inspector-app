name: secondlife_app_inspector
description: "SecondLife Mobile App for Technicians & Inspectors (KTV) - On-site Inspection, QR Tamper Seal Verification & Quality Checklists"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  riverpod_annotation: ^4.0.7
  go_router: ^17.5.0
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  intl: ^0.20.3
  uuid: ^4.6.0
  cached_network_image: ^3.4.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  geolocator: ^14.1.1
  image_picker: ^1.2.4
  mobile_scanner: ^7.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
